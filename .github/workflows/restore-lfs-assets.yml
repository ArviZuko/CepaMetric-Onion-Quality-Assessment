name: Restore original large files with Git LFS
on:
  push:
    branches: [main]
    paths: [.github/workflows/restore-lfs-assets.yml]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Restore and verify released files
        shell: python
        run: |
          import concurrent.futures, hashlib, json, os, pathlib, shutil, subprocess, zipfile
          root = pathlib.Path.cwd()
          config = json.loads("{\"name\":\"CepaMetric-Onion-Quality-Assessment\",\"tag\":\"v1.0-large-files\",\"groups\":[{\"asset\":\"convnexttiny-weights.zip\",\"expected\":[\"SRC/Models/convnexttiny/convnexttiny_model.weights (1).h5\"],\"note\":\"SRC/Models/convnexttiny/README.md\",\"assets\":[{\"name\":\"convnexttiny-weights.zip\",\"size\":336782816,\"digest\":\"sha256:df0d9ee45f6def5c7737178830c199095eb8dda7b3609a834494ba2d57cd4f0b\",\"url\":\"https://github.com/ArviZuko/CepaMetric-Onion-Quality-Assessment/releases/download/v1.0-large-files/convnexttiny-weights.zip\"}],\"noteText\":\"# SRC/Models/convnexttiny\\n\\nThe original `convnexttiny_model.weights (1).h5` is too large for GitHub’s per-file Git limit. Download [convnexttiny-weights.zip](https://github.com/ArviZuko/cepametric/releases/download/v1.0-large-files/convnexttiny-weights.zip) from the [large-file Release](https://github.com/ArviZuko/cepametric/releases/tag/v1.0-large-files) and extract it at the repository root. The ZIP preserves the original folder path and filename.\\n\"},{\"asset\":\"resnet-weights.zip\",\"expected\":[\"SRC/Models/Resnet/resnet_model.weights.h5\"],\"note\":\"SRC/Models/Resnet/README.md\",\"assets\":[{\"name\":\"resnet-weights.zip\",\"size\":289003656,\"digest\":\"sha256:310f9e9cecd41986f51364b4e1020429a96f013c63fca6088ffcbd6ee30eba7d\",\"url\":\"https://github.com/ArviZuko/CepaMetric-Onion-Quality-Assessment/releases/download/v1.0-large-files/resnet-weights.zip\"}],\"noteText\":\"# SRC/Models/Resnet\\n\\nThe original `resnet_model.weights.h5` is too large for GitHub’s per-file Git limit. Download [resnet-weights.zip](https://github.com/ArviZuko/cepametric/releases/download/v1.0-large-files/resnet-weights.zip) from the [large-file Release](https://github.com/ArviZuko/cepametric/releases/tag/v1.0-large-files) and extract it at the repository root. The ZIP preserves the original folder path and filename.\\n\"},{\"asset\":\"xception-weights.zip\",\"expected\":[\"SRC/Models/Exception/xception_model.weights.h5\"],\"note\":\"SRC/Models/Exception/README.md\",\"assets\":[{\"name\":\"xception-weights.zip\",\"size\":256285922,\"digest\":\"sha256:2ac8b1bd2a3ee142ee5c701c0a77fd5ff9fca8efb786d995446716ed8fd84fd5\",\"url\":\"https://github.com/ArviZuko/CepaMetric-Onion-Quality-Assessment/releases/download/v1.0-large-files/xception-weights.zip\"}],\"noteText\":\"# SRC/Models/Exception\\n\\nThe original `xception_model.weights.h5` is too large for GitHub’s per-file Git limit. Download [xception-weights.zip](https://github.com/ArviZuko/cepametric/releases/download/v1.0-large-files/xception-weights.zip) from the [large-file Release](https://github.com/ArviZuko/cepametric/releases/tag/v1.0-large-files) and extract it at the repository root. The ZIP preserves the original folder path and filename.\\n\"},{\"asset\":\"windows-installer.zip\",\"expected\":[\"SRC/Windows/Installer/OnionAIInspectionSetup.exe\"],\"note\":\"SRC/Windows/Installer/README.md\",\"assets\":[{\"name\":\"windows-installer.zip\",\"size\":1282771153,\"digest\":\"sha256:73d7246df675610369c6f62f0278344413ead897cc1b88c31c0210001b326c8f\",\"url\":\"https://github.com/ArviZuko/CepaMetric-Onion-Quality-Assessment/releases/download/v1.0-large-files/windows-installer.zip\"}],\"noteText\":\"# SRC/Windows/Installer\\n\\nThe original `OnionAIInspectionSetup.exe` is too large for GitHub’s per-file Git limit. Download [windows-installer.zip](https://github.com/ArviZuko/cepametric/releases/download/v1.0-large-files/windows-installer.zip) from the [large-file Release](https://github.com/ArviZuko/cepametric/releases/tag/v1.0-large-files) and extract it at the repository root. The ZIP preserves the original folder path and filename.\\n\"},{\"asset\":\"demo-video.zip\",\"expected\":[\"Documentation/Video.mp4\"],\"note\":\"Documentation/README.md\",\"assets\":[{\"name\":\"demo-video.zip\",\"size\":226266990,\"digest\":\"sha256:74075701dff95ca6cebff80cb3ca7fbfc9cbe876089b6f73f4423285765c0260\",\"url\":\"https://github.com/ArviZuko/CepaMetric-Onion-Quality-Assessment/releases/download/v1.0-large-files/demo-video.zip\"}],\"noteText\":\"# Documentation\\n\\nThe original `Video.mp4` is too large for GitHub’s per-file Git limit. Download [demo-video.zip](https://github.com/ArviZuko/cepametric/releases/download/v1.0-large-files/demo-video.zip) from the [large-file Release](https://github.com/ArviZuko/cepametric/releases/tag/v1.0-large-files) and extract it at the repository root. The ZIP preserves the original folder path and filename.\\n\"}],\"originalReadme\":\"# CepaMetric — Onion AI Inspection System\\n\\nCepaMetric is a conveyor-oriented onion quality inspection project developed by **Team CepaMetric** for Smart India Hackathon 2026 (problem statement **SIH26031**, Smart Automation). It aims to make onion grading more consistent by combining RGB-D measurement, object tracking, image classification, an operator dashboard, and sorting control. The supplied project includes Windows and Raspberry Pi application sources, an onion image dataset, five model-weight files, a Windows installer, a report, a presentation, and a demonstration video. The [project report](Documentation/Onion_AI_Inspection_System_Project_Report.docx) identifies the team as Team ID 167398 at Sanjivani University, Kopargaon.\\n\\n## What the system is designed to do\\n\\nManual inspection can vary between operators and procurement centers. CepaMetric's proposed workflow separates **physical measurement** from **health classification**:\\n\\n```text\\nOnion on conveyor\\n    → RGB + depth frame from an Intel RealSense D455f\\n    → contour/depth-based onion detection and persistent tracking ID\\n    → diameter estimate in millimetres and a size grade\\n    → cropped RGB image → CNN health prediction\\n    → optional Grad-CAM explanation and reflectance comparison\\n    → dashboard record and sorting decision\\n```\\n\\nThe report describes four health categories: **Moldy, Normal, Rotten, and Sprouted**. Its intended size bins are **below 40 mm**, **40–50 mm**, **50–60 mm**, and **above 60 mm**, with a reject route for diseased onions. The software source contains code for the dashboard, model inference, tracking, measurement, reflectance views, and related controls. The full camera-to-actuator workflow requires the original hardware and deployment assets; it was not independently validated when this repository was published.\\n\\n## Why this approach\\n\\n- **Hybrid inspection:** Classical computer vision and depth data locate, track, and measure onions. CNNs evaluate only the cropped onion image, reducing full-frame model work.\\n- **Physical size rather than pixel count:** The design uses camera geometry and depth to estimate diameter in millimetres. Calibration and camera placement remain essential.\\n- **Multiple classifiers:** ConvNeXt Tiny, EfficientNetV2-B0, DenseNet121, ResNet, and Xception provide four-class predictions. The source also offers probability averaging as an ensemble mode and references a stacking meta-classifier.\\n- **Reviewable decisions:** The application includes Grad-CAM generation and capture history so operators can inspect model outputs. The report additionally proposes a reflectance check against a reference set of normal onions.\\n\\nThese are design features, not claims that every branch is ready to run from a fresh clone. The [report](Documentation/Onion_AI_Inspection_System_Project_Report.docx) describes a broader integrated prototype than the portable files supplied here.\\n\\n## Repository structure\\n\\n```text\\ncepametric/\\n├── Dataset/\\n│   ├── train/                 labeled onion images\\n│   ├── valid/                 validation images\\n│   ├── test/                  test images\\n│   └── labels.csv             image and class metadata\\n├── SRC/\\n│   ├── Models/\\n│   │   ├── convnexttiny/      checkpoint in Release\\n│   │   ├── densenet121/      checkpoint in Git\\n│   │   ├── effnetv2/         checkpoint in Git\\n│   │   ├── Exception/        Xception checkpoint in Release\\n│   │   └── Resnet/           ResNet checkpoint in Release\\n│   ├── Raspi/                Raspberry Pi application and setup scripts\\n│   └── Windows/\\n│       ├── Src/              Windows PyQt application source\\n│       ├── Application/      Inno Setup project\\n│       └── Installer/        installer download guide\\n├── Documentation/           report, slides, and video download guide\\n└── Screenshots/              supplied interface and prototype images\\n```\\n\\nThe `Exception/` folder is the supplied folder name for the **Xception** model and is preserved as received.\\n\\n### Dataset\\n\\nThe repository includes **2,539 image files** in four class folders, plus `Dataset/labels.csv`:\\n\\n| Split | Molded | Normal | Rotten | Sprouted | Total images |\\n| --- | ---: | ---: | ---: | ---: | ---: |\\n| Train | 264 | 708 | 151 | 653 | 1,776 |\\n| Validation | 75 | 203 | 43 | 188 | 509 |\\n| Test | 38 | 102 | 21 | 93 | 254 |\\n\\nThe image folder uses **`molded`** while the application displays **Moldy**. `labels.csv` records source and split metadata. The report's statement that the raw dataset was not copied into its referenced repository is outdated for **this** repository: the above images are present here. Dataset provenance and reuse rights should be checked before redistribution.\\n\\n### Model weights\\n\\n| Model family | Supplied location | Delivery |\\n| --- | --- | --- |\\n| ConvNeXt Tiny | `SRC/Models/convnexttiny/` | [Release download guide](SRC/Models/convnexttiny/README.md) |\\n| EfficientNetV2-B0 | `SRC/Models/effnetv2/` | [Weight in Git](SRC/Models/effnetv2/effnetv2b0model.weights.h5) |\\n| DenseNet121 | `SRC/Models/densenet121/` | [Weight in Git](SRC/Models/densenet121/onion_densenet121_best_macro_f1.weights.h5) |\\n| ResNet | `SRC/Models/Resnet/` | [Release download guide](SRC/Models/Resnet/README.md) |\\n| Xception | `SRC/Models/Exception/` | [Release download guide](SRC/Models/Exception/README.md) |\\n\\nThe report calls the ResNet architecture **ResNet50V2**. The application code defines model builders and loads weights, but this repository does **not** contain the `onion_stacking_meta_classifier_best.keras` file referenced by the stacking option. Ensemble averaging has no separate checkpoint.\\n\\n## Restoring large files\\n\\nFive files exceeded GitHub's per-file Git limit. Download them from the [v1.0 large-files Release](https://github.com/ArviZuko/cepametric/releases/tag/v1.0-large-files). Each independent ZIP stores the original path and filename; **extract it at the repository root**.\\n\\n| File | Folder guide |\\n| --- | --- |\\n| Windows installer | [`SRC/Windows/Installer/README.md`](SRC/Windows/Installer/README.md) |\\n| ConvNeXt Tiny weights | [`SRC/Models/convnexttiny/README.md`](SRC/Models/convnexttiny/README.md) |\\n| ResNet weights | [`SRC/Models/Resnet/README.md`](SRC/Models/Resnet/README.md) |\\n| Xception weights | [`SRC/Models/Exception/README.md`](SRC/Models/Exception/README.md) |\\n| Demonstration video | [`Documentation/README.md`](Documentation/README.md) |\\n\\n## Application entry points and setup\\n\\n- **Windows:** [`SRC/Windows/Src/app.py`](SRC/Windows/Src/app.py) is the Python source. An [Inno Setup definition](SRC/Windows/Application/OnionAIInspection.iss) and the [supplied installer](SRC/Windows/Installer/README.md) are also available. The code imports TensorFlow/Keras, PyQt5, OpenCV, NumPy, Matplotlib, and `pyrealsense2`; a Windows dependency lockfile is not supplied.\\n- **Raspberry Pi:** [`SRC/Raspi/final.py`](SRC/Raspi/final.py) is the application source. Start with [`setup.sh`](SRC/Raspi/setup.sh), [`requirements-pi.txt`](SRC/Raspi/requirements-pi.txt), and [`run.sh`](SRC/Raspi/run.sh). The supplied setup script targets a **64-bit Raspberry Pi 5** and installs system packages as well as Python dependencies. Review the script before running it on your device.\\n\\n**Fresh-clone limitation:** The Windows source looks for model weights under a root-level `Training_DL_Models/Model_*/weights/` tree, whereas the supplied files are organized under `SRC/Models/`. The Raspberry Pi source also expects a separate `Weight Files/` directory beside `final.py`. Those paths must be reconciled for source execution. Both application sources reference a stacking checkpoint and external reflectance/reference assets that are absent from the supplied folder. Restoring the five Release ZIPs recreates the supplied folder, but does not create those missing assets. The installer was uploaded as provided and has not been independently tested on a clean machine.\\n\\n## Reported results and current limits\\n\\nThe [project report](Documentation/Onion_AI_Inspection_System_Project_Report.docx) reports a **1.6 mm mean absolute diameter error across five onions** and **94% size-grade accuracy** for its prototype. It does not provide a reproducible classifier accuracy, Macro-F1, balanced accuracy, or confusion matrix for the files in this repository. Treat those numbers as report claims, not independently reproduced benchmarks.\\n\\nRealSense sizing depends on calibration and scene geometry; model results depend on the dataset and compatible checkpoints. Before deployment, validate image provenance, the class mapping, the chosen camera and lighting, model paths, and sorting hardware. The report itself lists broader classifier evaluation and clean-machine packaging as remaining work.\\n\\n## Documentation and attribution\\n\\n- [Onion AI Inspection System project report](Documentation/Onion_AI_Inspection_System_Project_Report.docx)\\n- [CepaMetric project presentation](Documentation/CepaMetric_GitHub_Project_15_Slides.pptx)\\n- [Demonstration video download](Documentation/README.md)\\n- [Project screenshots](Screenshots/)\\n\\nNo project-level license was included in the supplied folder. Verify rights to the source, dataset, weights, report, and installer before reuse or redistribution.\\n\",\"updatedReadme\":\"# CepaMetric — Onion AI Inspection System\\n\\nCepaMetric is a conveyor-oriented onion quality inspection project developed by **Team CepaMetric** for Smart India Hackathon 2026 (problem statement **SIH26031**, Smart Automation). It aims to make onion grading more consistent by combining RGB-D measurement, object tracking, image classification, an operator dashboard, and sorting control. The supplied project includes Windows and Raspberry Pi application sources, an onion image dataset, five model-weight files, a Windows installer, a report, a presentation, and a demonstration video. The [project report](Documentation/Onion_AI_Inspection_System_Project_Report.docx) identifies the team as Team ID 167398 at Sanjivani University, Kopargaon.\\n\\n## What the system is designed to do\\n\\nManual inspection can vary between operators and procurement centers. CepaMetric's proposed workflow separates **physical measurement** from **health classification**:\\n\\n```text\\nOnion on conveyor\\n    → RGB + depth frame from an Intel RealSense D455f\\n    → contour/depth-based onion detection and persistent tracking ID\\n    → diameter estimate in millimetres and a size grade\\n    → cropped RGB image → CNN health prediction\\n    → optional Grad-CAM explanation and reflectance comparison\\n    → dashboard record and sorting decision\\n```\\n\\nThe report describes four health categories: **Moldy, Normal, Rotten, and Sprouted**. Its intended size bins are **below 40 mm**, **40–50 mm**, **50–60 mm**, and **above 60 mm**, with a reject route for diseased onions. The software source contains code for the dashboard, model inference, tracking, measurement, reflectance views, and related controls. The full camera-to-actuator workflow requires the original hardware and deployment assets; it was not independently validated when this repository was published.\\n\\n## Why this approach\\n\\n- **Hybrid inspection:** Classical computer vision and depth data locate, track, and measure onions. CNNs evaluate only the cropped onion image, reducing full-frame model work.\\n- **Physical size rather than pixel count:** The design uses camera geometry and depth to estimate diameter in millimetres. Calibration and camera placement remain essential.\\n- **Multiple classifiers:** ConvNeXt Tiny, EfficientNetV2-B0, DenseNet121, ResNet, and Xception provide four-class predictions. The source also offers probability averaging as an ensemble mode and references a stacking meta-classifier.\\n- **Reviewable decisions:** The application includes Grad-CAM generation and capture history so operators can inspect model outputs. The report additionally proposes a reflectance check against a reference set of normal onions.\\n\\nThese are design features, not claims that every branch is ready to run from a fresh clone. The [report](Documentation/Onion_AI_Inspection_System_Project_Report.docx) describes a broader integrated prototype than the portable files supplied here.\\n\\n## Repository structure\\n\\n```text\\ncepametric/\\n├── Dataset/\\n│   ├── train/                 labeled onion images\\n│   ├── valid/                 validation images\\n│   ├── test/                  test images\\n│   └── labels.csv             image and class metadata\\n├── SRC/\\n│   ├── Models/\\n│   │   ├── convnexttiny/      checkpoint in Git LFS\\n│   │   ├── densenet121/      checkpoint in Git\\n│   │   ├── effnetv2/         checkpoint in Git\\n│   │   ├── Exception/        Xception checkpoint in Git LFS\\n│   │   └── Resnet/           ResNet checkpoint in Git LFS\\n│   ├── Raspi/                Raspberry Pi application and setup scripts\\n│   └── Windows/\\n│       ├── Src/              Windows PyQt application source\\n│       ├── Application/      Inno Setup project\\n│       └── Installer/        installer executable (Git LFS)\\n├── Documentation/           report, slides, and video (Git LFS)\\n└── Screenshots/              supplied interface and prototype images\\n```\\n\\nThe `Exception/` folder is the supplied folder name for the **Xception** model and is preserved as received.\\n\\n### Dataset\\n\\nThe repository includes **2,539 image files** in four class folders, plus `Dataset/labels.csv`:\\n\\n| Split | Molded | Normal | Rotten | Sprouted | Total images |\\n| --- | ---: | ---: | ---: | ---: | ---: |\\n| Train | 264 | 708 | 151 | 653 | 1,776 |\\n| Validation | 75 | 203 | 43 | 188 | 509 |\\n| Test | 38 | 102 | 21 | 93 | 254 |\\n\\nThe image folder uses **`molded`** while the application displays **Moldy**. `labels.csv` records source and split metadata. The report's statement that the raw dataset was not copied into its referenced repository is outdated for **this** repository: the above images are present here. Dataset provenance and reuse rights should be checked before redistribution.\\n\\n### Model weights\\n\\n| Model family | Supplied location | Delivery |\\n| --- | --- | --- |\\n| ConvNeXt Tiny | `SRC/Models/convnexttiny/` | [Weight in Git LFS](SRC/Models/convnexttiny/convnexttiny_model.weights%20%281%29.h5) |\\n| EfficientNetV2-B0 | `SRC/Models/effnetv2/` | [Weight in Git](SRC/Models/effnetv2/effnetv2b0model.weights.h5) |\\n| DenseNet121 | `SRC/Models/densenet121/` | [Weight in Git](SRC/Models/densenet121/onion_densenet121_best_macro_f1.weights.h5) |\\n| ResNet | `SRC/Models/Resnet/` | [Weight in Git LFS](SRC/Models/Resnet/resnet_model.weights.h5) |\\n| Xception | `SRC/Models/Exception/` | [Weight in Git LFS](SRC/Models/Exception/xception_model.weights.h5) |\\n\\nThe report calls the ResNet architecture **ResNet50V2**. The application code defines model builders and loads weights, but this repository does **not** contain the `onion_stacking_meta_classifier_best.keras` file referenced by the stacking option. Ensemble averaging has no separate checkpoint.\\n\\n## Large files with Git LFS\\n\\nThe installer, ConvNeXt Tiny/ResNet/Xception weights, and demonstration video are stored directly in their original folders using Git LFS.\\n\\n```bash\\ngit lfs install\\ngit clone https://github.com/ArviZuko/CepaMetric-Onion-Quality-Assessment.git\\ncd CepaMetric-Onion-Quality-Assessment\\ngit lfs pull\\n```\\n\\n## Application entry points and setup\\n\\n- **Windows:** [`SRC/Windows/Src/app.py`](SRC/Windows/Src/app.py) is the Python source. An [Inno Setup definition](SRC/Windows/Application/OnionAIInspection.iss) and the [supplied installer](SRC/Windows/Installer/OnionAIInspectionSetup.exe) are also available. The code imports TensorFlow/Keras, PyQt5, OpenCV, NumPy, Matplotlib, and `pyrealsense2`; a Windows dependency lockfile is not supplied.\\n- **Raspberry Pi:** [`SRC/Raspi/final.py`](SRC/Raspi/final.py) is the application source. Start with [`setup.sh`](SRC/Raspi/setup.sh), [`requirements-pi.txt`](SRC/Raspi/requirements-pi.txt), and [`run.sh`](SRC/Raspi/run.sh). The supplied setup script targets a **64-bit Raspberry Pi 5** and installs system packages as well as Python dependencies. Review the script before running it on your device.\\n\\n**Fresh-clone limitation:** The Windows source looks for model weights under a root-level `Training_DL_Models/Model_*/weights/` tree, whereas the supplied files are organized under `SRC/Models/`. The Raspberry Pi source also expects a separate `Weight Files/` directory beside `final.py`. Those paths must be reconciled for source execution. Both application sources reference a stacking checkpoint and external reflectance/reference assets that are absent from the supplied folder. Git LFS restores the supplied large files, but does not create those missing assets. The installer was uploaded as provided and has not been independently tested on a clean machine.\\n\\n## Reported results and current limits\\n\\nThe [project report](Documentation/Onion_AI_Inspection_System_Project_Report.docx) reports a **1.6 mm mean absolute diameter error across five onions** and **94% size-grade accuracy** for its prototype. It does not provide a reproducible classifier accuracy, Macro-F1, balanced accuracy, or confusion matrix for the files in this repository. Treat those numbers as report claims, not independently reproduced benchmarks.\\n\\nRealSense sizing depends on calibration and scene geometry; model results depend on the dataset and compatible checkpoints. Before deployment, validate image provenance, the class mapping, the chosen camera and lighting, model paths, and sorting hardware. The report itself lists broader classifier evaluation and clean-machine packaging as remaining work.\\n\\n## Documentation and attribution\\n\\n- [Onion AI Inspection System project report](Documentation/Onion_AI_Inspection_System_Project_Report.docx)\\n- [CepaMetric project presentation](Documentation/CepaMetric_GitHub_Project_15_Slides.pptx)\\n- [Demonstration video](Documentation/Video.mp4)\\n- [Project screenshots](Screenshots/)\\n\\nNo project-level license was included in the supplied folder. Verify rights to the source, dataset, weights, report, and installer before reuse or redistribution.\\n\",\"workflowPath\":\".github/workflows/restore-lfs-assets.yml\"}")
          temp = pathlib.Path(os.environ["RUNNER_TEMP"]) / "restore-lfs-assets"
          temp.mkdir(exist_ok=True)
          def run(*args, **kwargs):
              return subprocess.run(args, check=True, **kwargs)
          def digest(path, algorithm="sha256"):
              with open(path, "rb") as stream:
                  return hashlib.file_digest(stream, algorithm).hexdigest()
          def safe_path(name):
              relative = pathlib.PurePosixPath(name.replace("\\", "/"))
              assert not relative.is_absolute() and ".." not in relative.parts and ".git" not in relative.parts, name
              return relative.as_posix()
          assets = {a["name"]: a for g in config["groups"] for a in g["assets"]}
          def download(asset):
              print("Downloading", asset["name"], flush=True)
              target = temp / asset["name"]
              run("curl", "--fail", "--location", "--retry", "5", "--connect-timeout", "30", "--speed-time", "60", "--speed-limit", "1024", "--max-time", "1800", "--silent", "--show-error", "-o", str(target), asset["url"])
              assert target.stat().st_size == asset["size"], asset["name"]
              assert "sha256:" + digest(target) == asset["digest"], asset["name"]
              print("Verified download", asset["name"], flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              list(pool.map(download, assets.values()))
          run("git", "lfs", "install", "--local")
          records = {}
          group_skipped = {}
          original_tracked = set(subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0"))
          for group in config["groups"]:
              print("Restoring", group["assets"][0]["name"], flush=True)
              skipped = []
              staged_paths = []
              def restore(name, size, stream_factory):
                  name = safe_path(name)
                  if size > 2 * 1024**3:
                      skipped.append({"path": name, "size": size})
                      print("Retained in Releases due to LFS size limit:", name, size, flush=True)
                      return
                  destination = root / name
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  candidate = temp / "current-file"
                  sha256 = hashlib.sha256()
                  sha1 = hashlib.sha1(("blob " + str(size) + "\0").encode())
                  with stream_factory() as source, open(candidate, "wb") as output:
                      while chunk := source.read(1024 * 1024):
                          output.write(chunk)
                          sha256.update(chunk)
                          sha1.update(chunk)
                  assert candidate.stat().st_size == size, name
                  content_sha256 = sha256.hexdigest()
                  if destination.exists():
                      if destination.stat().st_size < 256 and destination.read_bytes().startswith(b"version https://git-lfs.github.com/spec/v1\n"):
                          pointer = destination.read_text()
                          assert "oid sha256:" + content_sha256 + "\n" in pointer and "\nsize " + str(size) + "\n" in pointer, name
                      else:
                          assert digest(destination) == content_sha256, "Existing file differs: " + name
                  shutil.move(str(candidate), str(destination))
                  lfs = size >= 50 * 1024**2
                  if lfs:
                      run("git", "lfs", "track", "--filename", name)
                      pointer = ("version https://git-lfs.github.com/spec/v1\noid sha256:" + content_sha256 + "\nsize " + str(size) + "\n").encode()
                      expected_blob = hashlib.sha1(("blob " + str(len(pointer)) + "\0").encode() + pointer).hexdigest()
                  else:
                      expected_blob = sha1.hexdigest()
                  records[name] = {"path": name, "size": size, "sha256": content_sha256, "blob": expected_blob, "lfs": lfs, "new": name not in original_tracked}
                  staged_paths.append(name)
              asset_paths = [temp / a["name"] for a in group["assets"]]
              if group.get("dest"):
                  asset = group["assets"][0]
                  restore(group["dest"], asset["size"], lambda: open(asset_paths[0], "rb"))
              else:
                  archive_path = asset_paths[0]
                  if len(asset_paths) > 1:
                      archive_path = temp / "joined.zip"
                      with open(archive_path, "wb") as output:
                          for part in asset_paths:
                              with open(part, "rb") as source:
                                  shutil.copyfileobj(source, output)
                  with zipfile.ZipFile(archive_path) as archive:
                      members = [m for m in archive.infolist() if not m.is_dir()]
                      names = [safe_path(str(pathlib.PurePosixPath(group.get("prefix", "")) / safe_path(m.filename))) for m in members]
                      assert len(names) == len(set(names)), "Repeated archive path"
                      if group.get("expected"):
                          assert set(names) == set(group["expected"]), (names, group["expected"])
                      for member, name in zip(members, names):
                          restore(name, member.file_size, lambda m=member: archive.open(m))
                  if len(asset_paths) > 1:
                      archive_path.unlink()
              for asset_path in asset_paths:
                  asset_path.unlink()
              for offset in range(0, len(staged_paths), 100):
                  run("git", "add", "-f", "--", *staged_paths[offset:offset+100])
              for name in staged_paths:
                  if records[name]["lfs"]:
                      (root / name).unlink()
              note = group.get("note")
              if note:
                  path = root / note
                  assert path.read_text() == group["noteText"], "Download note changed: " + note
                  if skipped:
                      text = path.read_text()
                      addition = "\nFiles within the GitHub LFS size limit are now restored in their original locations. The following originals remain in Releases because they exceed the per-file limit:\n\n" + "\n".join("- " + item["path"] + " (" + str(item["size"]) + " bytes)" for item in skipped) + "\n"
                      path.write_text(text.split("\n",1)[0] + "\n" + addition + "\n" + text.split("\n",1)[1])
                      run("git", "add", "--", note)
                  else:
                      run("git", "rm", "-f", "--", note)
              group_skipped[group["assets"][0]["name"]] = skipped
          ignore = root / ".gitignore"
          if ignore.exists() and config.get("ignoreRemove"):
              lines = ignore.read_text().splitlines()
              ignore.write_text("\n".join(line for line in lines if line not in config["ignoreRemove"]) + "\n")
              run("git", "add", "--", ".gitignore")
          readme = root / "README.md"
          assert readme.read_text() == config["originalReadme"], "Main README changed"
          readme.write_text(config["updatedReadme"])
          run("git", "add", "-f", "--", ".gitattributes", "README.md")
          if config.get("modelsIndex"):
              index_path = root / "Models/README.md"
              assert index_path.read_text() == config["modelsIndex"]["original"]
              skipped_notes = {g["note"] for g in config["groups"] if g.get("note") and group_skipped[g["assets"][0]["name"]]}
              text = "# SAVE model files\n\nRestored model artifacts are stored at their original paths. Files larger than 50 MiB use Git LFS; install Git LFS before cloning and run git lfs pull in an existing clone.\n\n## Files retained in Releases\n\nThe following folder notes describe files that exceed GitHub's LFS per-file size limit:\n\n"
              for note in sorted(skipped_notes):
                  from urllib.parse import quote
                  text += "- [" + note.removeprefix("Models/").removesuffix("/README.md") + "](" + quote(note.removeprefix("Models/")) + ")\n"
              index_path.write_text(text)
              run("git", "add", "--", "Models/README.md")
          index = {}
          for row in subprocess.check_output(["git", "ls-files", "--stage", "-z"]).split(b"\0"):
              if row:
                  metadata, name = row.split(b"\t", 1)
                  index[name.decode()] = metadata.decode().split()[1]
          assert records, "No restored files"
          for name, record in records.items():
              assert index.get(name) == record["blob"], "Staged contents mismatch: " + name
          report = {"restoredFiles": list(records.values()), "retainedInReleases": [item for group in group_skipped.values() for item in group], "newFiles": sum(r["new"] for r in records.values()), "lfsFiles": sum(r["lfs"] for r in records.values())}
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("Restored " + str(len(records)) + " files (" + str(report["lfsFiles"]) + " using Git LFS). Retained " + str(len(report["retainedInReleases"])) + " oversized originals in Releases.\n\n")
              for item in report["retainedInReleases"]:
                  summary.write("- " + item["path"] + ": " + str(item["size"]) + " bytes\n")
          print("MIGRATION_REPORT " + json.dumps(report), flush=True)
          run("git", "rm", config["workflowPath"])
          run("git", "config", "user.name", "github-actions[bot]")
          run("git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com")
          run("git", "commit", "--quiet", "-m", "Restore release-hosted files to their original folders with Git LFS")
          run("git", "push", "origin", "HEAD:main")
          
